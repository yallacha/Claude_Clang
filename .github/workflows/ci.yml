# CI (GitHub Actions): 빌드 + 소스코드 품질 기준(CLAUDE.md 2장). 하나라도 실패하면 PR을 완료할 수 없다.
# 개발과 동일한 claudeclangbuild 이미지(docker/build/Dockerfile) 안에서 ci/quality.sh 를 실행한다.
name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (claudeclangbuild)
        uses: docker/build-push-action@v6
        with:
          context: docker/build
          file: docker/build/Dockerfile
          tags: claudeclangbuild:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build (CMake + Ninja)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work claudeclangbuild:latest bash -c '
            if [ -f CMakeLists.txt ]; then
              cmake -S . -B build/cmake -G Ninja && cmake --build build/cmake
            else
              echo "[SKIPPED] CMakeLists.txt 없음"
            fi'

      - name: CppCheck
        if: ${{ !cancelled() }}
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work claudeclangbuild:latest ci/quality.sh cppcheck

      - name: Lizard (CCN<=10, 라인<=80)
        if: ${{ !cancelled() }}
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work claudeclangbuild:latest ci/quality.sh lizard

      - name: TDD tests
        if: ${{ !cancelled() }}
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work claudeclangbuild:latest ci/quality.sh tdd

      - name: Unit tests (MC/DC 100%)
        if: ${{ !cancelled() }}
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work claudeclangbuild:latest ci/quality.sh unit

      - name: Integration tests (Function 100%)
        if: ${{ !cancelled() }}
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work claudeclangbuild:latest ci/quality.sh integration

      - name: System tests (요구사항 커버리지 100%)
        if: ${{ !cancelled() }}
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work claudeclangbuild:latest ci/quality.sh system

      - name: CLOC
        if: ${{ !cancelled() }}
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work claudeclangbuild:latest ci/quality.sh cloc

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports/
          if-no-files-found: ignore
