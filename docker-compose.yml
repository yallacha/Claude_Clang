# CI 환경: Jenkins LTS (포트 8080, 이 PC에서만 접속).
#   docker compose up -d --build
# 파이프라인이 사용하는 빌드 이미지는 먼저 만들어 둔다:
#   docker build -t claudeclangbuild:latest -f docker/build/Dockerfile docker/build
services:
  jenkins:
    build: ./docker/jenkins
    image: claudeclang-jenkins:lts
    container_name: claudeclang-jenkins
    user: root
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
