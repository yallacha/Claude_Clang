jenkins:
  systemMessage: "Claude_Clang CI (Jenkins LTS)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "http://localhost:8080/"
  gitHubConfiguration:
    # 인증 없는 GitHub API 는 시간당 60회로 제한된다. 한도에 가까울 때만 대기한다.
    apiRateLimitChecker: ThrottleOnOver

security:
  gitHostKeyVerificationConfiguration:
    sshHostKeyVerificationStrategy: "noHostKeyVerificationStrategy"

jobs:
  - script: >
      multibranchPipelineJob('Claude_Clang') {
        displayName('Claude_Clang')
        branchSources {
          github {
            id('claude-clang-github')
            repoOwner('yallacha')
            repository('Claude_Clang')
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
        // GitHub 변경을 폴링(15분)으로 감지한다 (익명 API 한도 60회/시간) (이 PC는 외부에서 접근할 수 없으므로 웹훅 미사용)
        triggers {
          periodicFolderTrigger {
            interval('15m')
          }
        }
      }
